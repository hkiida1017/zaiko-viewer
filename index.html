<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="在庫一覧">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e293b">
<meta name="robots" content="noindex">
<title>在庫一覧</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--fg:#1e293b;--sub:#64748b;--line:#e2e8f0;--head:#f8fafc;--b:#fef3c7;--p:#dbeafe;--o:#f3e8ff;--w:#fffbeb;--acc:#0f766e}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--fg:#e2e8f0;--sub:#94a3b8;--line:#334155;--head:#273449;--b:#422006;--p:#172554;--o:#3b0764;--w:#1c1917;--acc:#2dd4bf}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:15px;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:#1e293b;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.hrow{display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:#334155;color:#fff;border:0;border-radius:8px;padding:7px 10px;font-size:14px}
#meta{font-size:12px;color:#cbd5e1;margin-top:4px}
#meta.stale{color:#fca5a5;font-weight:700}
.bar{padding:8px 12px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:9}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--card);color:var(--fg);border:1px solid var(--line);font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.search{margin:10px 12px 0;width:calc(100% - 24px);padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;padding:12px}
.card{background:var(--card);border-radius:10px;padding:8px 10px;border-left:4px solid}
.card span{display:block;font-size:11px;color:var(--sub)}
.card b{font-size:20px}
section{margin:12px;background:var(--card);border-radius:12px;overflow:hidden}
h2{margin:0;padding:10px 12px;font-size:16px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:var(--head);font-size:11px;color:var(--sub);text-align:center;font-weight:600}
tbody th{text-align:left;font-weight:600;position:sticky;left:0;background:var(--card);min-width:72px}
tbody th small{display:block;font-size:10px;color:var(--sub);font-weight:400}
td{text-align:right;min-width:52px}
td.w{background:var(--w)} td.o{background:var(--o)}
.gb{background:var(--b)!important}.gp{background:var(--p)!important}.go{background:var(--o)!important}
tr.tot th,tr.tot td{border-top:2px solid var(--sub);font-weight:700}
.zero,.na{color:var(--sub);opacity:.5;font-weight:400}
.neg{color:#dc2626}
.unit{text-align:center;color:var(--sub);font-size:12px}
.bad{font-size:10px;background:#dc2626;color:#fff;padding:1px 5px;border-radius:4px}
.warn{font-size:10px;background:#f59e0b;color:#fff;padding:1px 5px;border-radius:4px}
.msg{margin:16px 12px;padding:14px;border-radius:12px;background:var(--card);line-height:1.6}
.msg.err{border-left:4px solid #dc2626}
form.cfg{margin:12px;background:var(--card);border-radius:12px;padding:14px}
form.cfg label{display:block;font-size:13px;color:var(--sub);margin-top:10px}
form.cfg input{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;margin-top:4px}
form.cfg .btns{display:flex;gap:8px;margin-top:14px}
form.cfg button{flex:1;padding:11px;border-radius:10px;border:0;font-size:15px;font-weight:700}
.primary{background:var(--acc);color:#fff}.ghost{background:var(--head);color:var(--fg)}
.empty{padding:24px;text-align:center;color:var(--sub)}
.spin{display:inline-block;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1 id="title">📋 在庫一覧</h1>
    <button id="btnReload" aria-label="更新">🔄</button>
    <button id="btnCfg" aria-label="設定">⚙</button>
  </div>
  <div id="meta">読み込み中…</div>
</header>
<div id="app"></div>

<script>
(function () {
  'use strict';
  var KEY = 'zaiko_viewer_config';
  var data = null, filter = 'all', query = '', timer = null, loading = false;
  var $app = document.getElementById('app'), $meta = document.getElementById('meta');

  function loadCfg() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function saveCfg(c) { localStorage.setItem(KEY, JSON.stringify(c)); }

  // PCの「設定用リンク」から開いた場合：#owner=...&repo=...&token=... を保存してURLから消す
  (function importFromHash() {
    if (!location.hash || location.hash.length < 2) return;
    var p = new URLSearchParams(location.hash.slice(1));
    if (!p.get('owner') || !p.get('repo')) return;
    var cur = loadCfg() || {};
    saveCfg({ owner: p.get('owner'), repo: p.get('repo'), path: p.get('path') || 'stock.json', branch: p.get('branch') || 'main', token: p.get('token') || cur.token || '' });
    history.replaceState(null, '', location.pathname + location.search);
  })();

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { return Number(n || 0).toLocaleString('ja-JP', { maximumFractionDigits: 2 }); }
  function num(v) {
    if (v === null || v === undefined) return '<span class="na">−</span>';
    if (v === 0) return '<span class="zero">0</span>';
    return v < 0 ? '<b class="neg">' + fmt(v) + '</b>' : '<b>' + fmt(v) + '</b>';
  }
  function ago(iso) {
    var m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return 'たった今'; if (m < 60) return m + '分前';
    var h = Math.floor(m / 60); if (h < 24) return h + '時間前';
    return Math.floor(h / 24) + '日前';
  }
  function stamp(iso) { var d = new Date(iso); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  function showConfig(msg) {
    clearInterval(timer);
    var c = loadCfg() || { owner: '', repo: 'zaiko-data', path: 'stock.json', branch: 'main', token: '' };
    $meta.textContent = '初期設定';
    $app.innerHTML =
      (msg ? '<div class="msg err">' + esc(msg) + '</div>' : '') +
      '<form class="cfg" id="cfg"><b>接続設定</b>' +
      '<div style="font-size:12px;color:var(--sub);margin-top:4px">PCの「📡 スマホ連携」画面にある設定用リンクを開けば自動入力されます。</div>' +
      '<label>GitHubユーザー名<input name="owner" value="' + esc(c.owner) + '" autocapitalize="off" autocorrect="off"></label>' +
      '<label>データ用リポジトリ名<input name="repo" value="' + esc(c.repo) + '" autocapitalize="off" autocorrect="off"></label>' +
      '<label>ファイル名<input name="path" value="' + esc(c.path) + '" autocapitalize="off" autocorrect="off"></label>' +
      '<label>ブランチ<input name="branch" value="' + esc(c.branch) + '" autocapitalize="off" autocorrect="off"></label>' +
      '<label>読み取り用トークン<input name="token" type="password" value="' + esc(c.token) + '" autocapitalize="off" autocorrect="off" placeholder="github_pat_..."></label>' +
      '<div class="btns"><button type="button" class="ghost" id="cfgClear">設定を消去</button><button class="primary">保存して表示</button></div></form>';
    document.getElementById('cfg').onsubmit = function (e) {
      e.preventDefault();
      var f = e.target;
      saveCfg({ owner: f.owner.value.trim(), repo: f.repo.value.trim(), path: f.path.value.trim() || 'stock.json', branch: f.branch.value.trim() || 'main', token: f.token.value.trim() });
      start();
    };
    document.getElementById('cfgClear').onclick = function () {
      if (confirm('この端末に保存した設定（トークン含む）を消去しますか？')) { localStorage.removeItem(KEY); showConfig(); }
    };
  }

  function load() {
    var c = loadCfg();
    if (!c || !c.owner || !c.repo) { showConfig(); return; }
    if (loading) return;
    loading = true;
    document.getElementById('btnReload').innerHTML = '<span class="spin">🔄</span>';
    var url = 'https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + '/contents/' +
      c.path.split('/').map(encodeURIComponent).join('/') + '?ref=' + encodeURIComponent(c.branch || 'main') + '&t=' + Date.now();
    var headers = { 'Accept': 'application/vnd.github.raw+json' };
    if (c.token) headers['Authorization'] = 'Bearer ' + c.token;
    fetch(url, { headers: headers, cache: 'no-store' })
      .then(function (r) {
        if (r.ok) return r.json();
        if (r.status === 401) throw new Error('トークンが無効か期限切れです。⚙ から新しいトークンを設定してください。');
        if (r.status === 403) throw new Error('アクセスが拒否されました（トークンの権限、または回数制限）。少し待ってから更新してください。');
        if (r.status === 404) throw new Error('データが見つかりません。リポジトリ名・ファイル名・トークンの対象リポジトリを確認するか、PCで一度「今すぐ送信」してください。');
        throw new Error('読み込みエラー（' + r.status + '）');
      })
      .then(function (j) { data = j; render(); })
      .catch(function (e) {
        var m = e.message === 'Failed to fetch' || e.message === 'Load failed' ? 'インターネットに接続できません。' : e.message;
        if (data) { $meta.textContent = '⚠ 更新できませんでした：' + m; $meta.className = 'stale'; }
        else if (/トークン|見つかりません/.test(m)) showConfig(m);
        else $app.innerHTML = '<div class="msg err">' + esc(m) + '</div>';
      })
      .then(function () { loading = false; document.getElementById('btnReload').textContent = '🔄'; });
  }

  function renderMeta() {
    if (!data || !data.generatedAt) return;
    var h = (Date.now() - new Date(data.generatedAt).getTime()) / 3600000;
    $meta.className = h >= 24 ? 'stale' : '';
    $meta.textContent = (h >= 24 ? '⚠ ' : '') + 'PC更新：' + stamp(data.generatedAt) + '（' + ago(data.generatedAt) + '）';
  }

  function render() {
    if (!data) return;
    document.getElementById('title').textContent = '📋 在庫一覧' + (data.company ? '｜' + data.company : '');
    renderMeta();
    var q = query.trim().toLowerCase();
    var t = data.totals || {};
    var html = '<input class="search" id="q" type="search" placeholder="🔍 種類・商品名・材料で検索" value="' + esc(query) + '">';

    var chips = [['all', 'すべて']];
    (data.lines || []).forEach(function (l, i) { chips.push(['l' + i, l.name]); });
    if ((data.unclassified || []).length) chips.push(['uncl', '未分類']);
    if ((data.materials || []).length) chips.push(['mat', '材料']);
    html += '<div class="bar">' + chips.map(function (c) { return '<button class="chip' + (filter === c[0] ? ' on' : '') + '" data-f="' + c[0] + '">' + esc(c[1]) + '</button>'; }).join('') + '</div>';

    if (filter === 'all' && !q) {
      var cards = [['本体在庫', t.body, '#b45309'], ['本体 内職中', t.workingWip, '#a16207'], ['完成品在庫', t.product, '#1d4ed8'], ['完成品 内職中', t.workingProduct, '#0369a1'], ['受注残', t.order, '#7e22ce']];
      html += '<div class="cards">' + cards.map(function (c) { return '<div class="card" style="border-color:' + c[2] + '"><span>' + c[0] + '</span><b>' + fmt(c[1]) + '</b></div>'; }).join('') + '</div>';
    }

    var shown = 0;
    (data.lines || []).forEach(function (l, i) {
      if (filter !== 'all' && filter !== 'l' + i) return;
      var lineHit = q && l.name.toLowerCase().indexOf(q) >= 0;
      var rows = l.rows.filter(function (r) { return !q || lineHit || String(r.v).toLowerCase().indexOf(q) >= 0; });
      if (!rows.length) return;
      var tot = { body: 0, workingWip: 0, product: 0, workingProduct: 0, order: 0 };
      var body = rows.map(function (r) {
        Object.keys(tot).forEach(function (k) { if (r[k] != null) tot[k] += r[k]; });
        return '<tr><th>' + esc(r.v) + '</th><td>' + num(r.body) + '</td><td class="w">' + num(r.workingWip) + '</td><td>' + num(r.product) + '</td><td class="w">' + num(r.workingProduct) + '</td><td class="o">' + num(r.order) + '</td></tr>';
      }).join('');
      body += '<tr class="tot"><th>合計</th><td>' + num(tot.body) + '</td><td class="w">' + num(tot.workingWip) + '</td><td>' + num(tot.product) + '</td><td class="w">' + num(tot.workingProduct) + '</td><td class="o">' + num(tot.order) + '</td></tr>';
      html += '<section><h2>' + esc(l.name) + '</h2><div class="scroll"><table><thead>' +
        '<tr><th rowspan="2">種類</th><th colspan="2" class="gb">本体</th><th colspan="2" class="gp">完成品</th><th rowspan="2" class="go">受注<br>残</th></tr>' +
        '<tr><th class="gb">社内</th><th class="gb">内職</th><th class="gp">社内</th><th class="gp">内職</th></tr></thead><tbody>' + body + '</tbody></table></div></section>';
      shown++;
    });

    if (filter === 'all' || filter === 'uncl') {
      var un = (data.unclassified || []).filter(function (r) { return !q || r.name.toLowerCase().indexOf(q) >= 0; });
      if (un.length) {
        html += '<section><h2>未分類の商品</h2><div class="scroll"><table><thead><tr><th>商品</th><th>社内在庫</th><th>内職中</th><th class="go">受注残</th></tr></thead><tbody>' +
          un.map(function (r) { return '<tr><th>' + esc(r.name) + '<small>' + (r.type === 'wip' ? '仕掛品' : '製品') + '</small></th><td>' + num(r.stock) + '</td><td class="w">' + num(r.working) + '</td><td class="o">' + num(r.order) + '</td></tr>'; }).join('') +
          '</tbody></table></div></section>';
        shown++;
      }
    }
    if (filter === 'all' || filter === 'mat') {
      var ms = (data.materials || []).filter(function (m) { return !q || m.name.toLowerCase().indexOf(q) >= 0; });
      if (ms.length) {
        html += '<section><h2>材料</h2><div class="scroll"><table><thead><tr><th>材料</th><th>在庫</th><th>単位</th></tr></thead><tbody>' +
          ms.map(function (m) {
            var b = m.stock <= 0 ? ' <span class="bad">在庫切れ</span>' : (m.stock < 10 ? ' <span class="warn">少量</span>' : '');
            return '<tr><th>' + esc(m.name) + b + '</th><td>' + num(m.stock) + '</td><td class="unit">' + esc(m.unit) + '</td></tr>';
          }).join('') + '</tbody></table></div></section>';
        shown++;
      }
    }
    if (!shown) html += '<p class="empty">該当するデータがありません</p>';
    $app.innerHTML = html;

    var $q = document.getElementById('q');
    $q.oninput = function () { query = $q.value; var pos = $q.selectionStart; render(); var n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); };
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (b) { b.onclick = function () { filter = b.getAttribute('data-f'); render(); window.scrollTo(0, 0); }; });
  }

  function start() {
    clearInterval(timer);
    load();
    timer = setInterval(function () { if (document.visibilityState === 'visible') load(); else renderMeta(); }, 60000);
  }

  document.getElementById('btnReload').onclick = function () { load(); };
  document.getElementById('btnCfg').onclick = function () { showConfig(); };
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && loadCfg()) load(); });
  start();
})();
</script>
</body>
</html>
